[build-system]
requires = ["setuptools>=61", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"



[project]
name = "aggregationslib"
description = "Python implementation of Arithmetic, quasi arithmetic and other aggregating functions"
readme = "README.rst"
license = { file = "LICENSE" }
requires-python = ">=3.14"
authors = [
    { name = "wgalka" }
]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent"
]
dependencies = [
    "numpy>=2.2.2",
    "packaging",
    "pynverse",
    "scikit-learn",
    "pandas",
    "scipy"
]
dynamic = ["version"]

[project.scripts]
agglib = "aggregationslib.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.3.4"]
app = ["shiny>=1.9,<2", "pygments>=2.19,<3", "matplotlib>=3.9,<4"]

[project.urls]
Homepage = "https://github.com/wgalka/Means"
Documentation = "https://wgalka.github.io/Means/"
Download = "https://github.com/wgalka/Means/releases/latest"

#[tool.setuptools]
#packages = []

[tool.setuptools.packages.find]
include = ["aggregationslib", "aggregationslib.*", "apps.shiny"]

[tool.setuptools.package-data]
"apps.shiny" = ["column-selection.js", "example.csv"]


[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"




